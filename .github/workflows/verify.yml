name: Verify and publish the game
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  innings:
    name: Player contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 24}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: npm run test:browser
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: {path: site}
  deploy:
    name: Publish Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: innings
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency: {group: pages-production, cancel-in-progress: false}
    steps:
      - name: Deploy the verified artifact
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Dependabot security
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 24}
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          show-openssf-scorecard: false
      - name: Verify the lockfile
        run: npm ci --ignore-scripts --no-audit --include=prod --include=dev --include=optional --include=peer --registry=https://registry.npmjs.org
      - name: Audit locked dependencies
        run: npm audit --audit-level=high --include=prod --include=dev --include=optional --include=peer --registry=https://registry.npmjs.org

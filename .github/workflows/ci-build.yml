name: CI build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 24}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Stage the static site and test harness
        run: |
          mkdir -p "$RUNNER_TEMP/ci-build/site"
          cp -R site/. "$RUNNER_TEMP/ci-build/site/"
          cp -R scripts test "$RUNNER_TEMP/ci-build/"
          cp package.json "$RUNNER_TEMP/ci-build/"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/ci-build/node_modules"
      - name: Check staged JavaScript
        working-directory: ${{ runner.temp }}/ci-build
        run: find site -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Test the staged site
        working-directory: ${{ runner.temp }}/ci-build
        run: npm test
      - name: Install Chromium
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Play the staged site
        working-directory: ${{ runner.temp }}/ci-build
        run: npm run test:browser
